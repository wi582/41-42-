<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#313338] h-screen flex overflow-hidden">

    <!-- ЛЕВАЯ ПАНЕЛЬ - КОМНАТЫ -->
    <aside class="w-60 bg-[#2b2d31] flex flex-col shrink-0">
        <div class="px-4 py-3 border-b border-[#1e1f22] flex items-center justify-between">
            <span class="text-white font-semibold text-sm">KOMATI</span>
            <button id="btn-create-room" class="text-[#949ba4] hover:text-white text-xl leading-none transition-colors">+</button>
        </div>
        <ul id="rooms-list" class="flex-1 overflow-y-auto py-2 flex flex-col gap-0.5 px-2"></ul>
        <div class="px-4 py-3 border-t border-[#1e1f22] flex items-center justify-between gap-2">
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-8 h-8 rounded-full bg-[#5865f2] flex items-center justify-center text-white text-sm font-bold shrink-0">
                    <span id="user-avatar"></span>
                </div>
                <span id="user-name" class="text-white text-sm truncate">Загрузка...</span>
            </div>
            <button id="btn-logout" class="text-[#949ba4] hover:text-red-400 transition-colors text-sm shrink-0">⏏</button>
        </div>
    </aside>

    <!-- ЦЕНТРАЛЬНАЯ ПАНЕЛЬ - СООБЩЕНИЯ -->
    <main class="flex-1 flex flex-col">
        <div class="h-12 bg-[#2b2d31] border-b border-[#1e1f22] px-4 flex items-center justify-between">
            <span id="room-name" class="text-white font-semibold text-sm">Выберите комнату</span>
            <button id="btn-leave-room" class="text-[#949ba4] hover:text-red-400 text-sm hidden">Выйти</button>
        </div>
        <div id="messages-area" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
            <div id="empty-state" class="text-center text-[#949ba4] mt-20">
                <p>Выберите комнату или создайте новую</p>
            </div>
            <div id="join-state" class="text-center text-[#949ba4] mt-20 hidden">
                <p>Вы не в этой комнате</p>
                <button id="btn-join-room" class="mt-2 bg-[#5865f2] hover:bg-[#4752c4] text-white px-4 py-1 rounded text-sm">Присоединиться</button>
            </div>
        </div>
        <div class="p-3 border-t border-[#1e1f22] bg-[#2b2d31]">
            <div class="flex gap-2">
                <input type="text" id="message-input" placeholder="Введите сообщение..." disabled class="flex-1 bg-[#1e1f22] text-white rounded px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-[#5865f2] disabled:opacity-50">
                <button id="btn-send" disabled class="bg-[#5865f2] hover:bg-[#4752c4] text-white px-4 rounded transition-colors disabled:opacity-50">➤</button>
            </div>
        </div>
    </main>

    <!-- ПРАВАЯ ПАНЕЛЬ - УЧАСТНИКИ -->
    <aside class="w-60 bg-[#2b2d31] flex flex-col border-l border-[#1e1f22]">
        <div class="px-4 py-3 border-b border-[#1e1f22]">
            <span class="text-white font-semibold text-sm">Участники</span>
        </div>
        <ul id="members-list" class="flex-1 overflow-y-auto py-2 px-2"></ul>
    </aside>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="modal-create" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden">
        <div class="bg-[#2b2d31] rounded-lg p-5 w-96">
            <h3 class="text-white font-semibold mb-3">Создать комнату</h3>
            <input id="input-room-name" type="text" placeholder="Название комнаты" class="w-full bg-[#1e1f22] text-white rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#5865f2] mb-3">
            <p id="room-error" class="text-red-400 text-sm mb-3 hidden"></p>
            <div class="flex gap-2 justify-end">
                <button id="btn-cancel-room" class="px-3 py-1 bg-[#1e1f22] text-white rounded text-sm">Отмена</button>
                <button id="btn-confirm-room" class="px-3 py-1 bg-[#5865f2] text-white rounded text-sm">Создать</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/socket-client.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
